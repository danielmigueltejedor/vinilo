[workspace]
resolver = "3"
members = [
    "crates/vinilo-core",
    "crates/vinilod",
    "crates/vinilo",
]

# Shared so the two crates cannot drift apart on a version.
[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `net` and `sync` are the daemon's: a Unix socket, and a broadcast channel to
# fan events out to every connected client.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "fs",
    "net",
    "sync",
    "macros",
    "time",
    # The daemon's own shutdown: a service manager stops it with SIGTERM, and
    # that is the last chance to write where playback had got to.
    "signal",
] }
tracing = "0.1"

# hyper-proxy2 0.1.0 still pulls rustls 0.22 / rustls-webpki 0.102 via
# hyper-rustls 0.26. Patch it onto 0.27 so the Spotify path shares the same
# rustls 0.23 line as reqwest (RUSTSEC-2026-* on the 0.22 stack).
[patch.crates-io]
hyper-proxy2 = { path = "vendor/hyper-proxy2" }
