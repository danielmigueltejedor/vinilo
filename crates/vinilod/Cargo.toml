[package]
name = "vinilod"
description = "The Vinilo daemon: owns the sidecar, serves clients over a socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Volume lives on the audio server's stream, not inside MusicKit — see mixer.rs.
vinilo-core = { path = "../vinilo-core" }
# Local files. MusicKit cannot open a path; this is the decoder that can.
rodio = { version = "0.19", features = [
    "symphonia-isomp4",
    "symphonia-vorbis",
    "symphonia-mp3",
] }
lofty = "0.22"
# Only to pick the process-wide crypto provider (see tls.rs).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Spotify Premium audio — Sonora's librespot fork, re-hosted on an orphan
# branch of this repo with quick-xml raised to 0.41 (RUSTSEC-2026-0194/0195).
# crates.io 0.8 still fails its vergen build against newer vergen-lib; do not
# merge `cursor/vendor-librespot-sca-df08` into main.
librespot-core = { git = "https://github.com/danielmigueltejedor/vinilo", rev = "393463e6a072c8b6fbc046641acf2e0956da4d6e", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-oauth = { git = "https://github.com/danielmigueltejedor/vinilo", rev = "393463e6a072c8b6fbc046641acf2e0956da4d6e", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-playback = { git = "https://github.com/danielmigueltejedor/vinilo", rev = "393463e6a072c8b6fbc046641acf2e0956da4d6e", default-features = false, features = [
    "rustls-tls-native-roots",
] }
# Keep librespot's build script on the vergen pair Sonora already ships.
vergen = { version = "=9.0.6", default-features = false }
vergen-lib = { version = "=0.1.6" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The stream volume lives in PulseAudio/PipeWire on Linux; macOS has neither.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2", default-features = false }
