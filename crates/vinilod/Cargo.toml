[package]
name = "vinilod"
description = "The Vinilo daemon: owns the sidecar, serves clients over a socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Volume lives on the audio server's stream, not inside MusicKit — see mixer.rs.
libpulse-binding = { version = "2", default-features = false }
vinilo-core = { path = "../vinilo-core" }
# Local files. MusicKit cannot open a path; this is the decoder that can.
rodio = { version = "0.19", features = [
    "symphonia-isomp4",
    "symphonia-vorbis",
    "symphonia-mp3",
] }
lofty = "0.22"

# Spotify Premium audio — Sonora's librespot fork. crates.io 0.8 currently
# fails its vergen build script against a newer vergen-lib; the pin below
# matches Sonora's lockfile so Arch can compile.
librespot-core = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-oauth = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-playback = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = [
    "rustls-tls-native-roots",
] }
# Keep librespot's build script on the vergen pair Sonora already ships.
vergen = { version = "=9.0.6", default-features = false }
vergen-lib = { version = "=0.1.6" }

anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
