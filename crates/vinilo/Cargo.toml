[package]
name = "vinilo"
description = "A native Apple Music client for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"

[dependencies]
vinilo-core = { path = "../vinilo-core" }

anyhow.workspace = true
# One call: fetching a cover in `components/artwork.rs`.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# No libadwaita since 2.0.0: the widgets and the look come from Nodalia Design
# Language's `nodalia-gtk`. relm4's `gnome_*` features would switch libadwaita
# back on, so GTK's version floor is set on the direct `gtk4` dependency instead.
relm4 = { version = "0.11", default-features = false, features = ["macros"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
# The Nodalia Design Language for GTK, without libadwaita. Pinned: the crate is alpha.
nodalia-gtk = { git = "https://github.com/danielmigueltejedor/nodalia-design", rev = "9be1a259fbcaa653c7f593f195572e4377eded72" }

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linux desktop integrations: the Background portal and the WebKit sign-in
# window. macOS signs in through the user's browser instead.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
    "background",
    "tokio",
] }
webkit6 = "0.6"
