<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Aguja</title>
  <defs>
    <!-- Same Colloid plate as Vinilo: 64 canvas, 56 tile, rx≈13, doubled. -->
    <linearGradient id="tile" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2a32"/>
      <stop offset="1" stop-color="#1a1418"/>
    </linearGradient>
    <radialGradient id="platter" cx="48" cy="54" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="0.55" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50" cy="56" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="0.4" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#0a080a"/>
    </radialGradient>
    <linearGradient id="shine" x1="40" y1="44" x2="78" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f5f4" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#7C3B96" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f6f5f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.5" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
    <clipPath id="disc">
      <circle cx="58" cy="70" r="33"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-6%" width="120%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)" filter="url(#shadow)"/>

  <g clip-path="url(#tile-clip)">
    <circle cx="58" cy="70" r="39" fill="url(#platter)"/>
    <circle cx="58" cy="70" r="33" fill="url(#vinyl)"/>

    <g clip-path="url(#disc)" fill="none" stroke-linecap="square">
      <circle cx="58" cy="70" r="31" stroke="#5e5c64" stroke-width="1.2" opacity="0.35"/>
      <circle cx="58" cy="70" r="28.4" stroke="#981F31" stroke-width="1.1" opacity="0.55"/>
      <circle cx="58" cy="70" r="25.8" stroke="#7C3B96" stroke-width="1.1" opacity="0.5"/>
      <circle cx="58" cy="70" r="23.2" stroke="#981F31" stroke-width="1.1" opacity="0.4"/>
      <circle cx="58" cy="70" r="20.6" stroke="#7C3B96" stroke-width="1.1" opacity="0.45"/>
      <circle cx="58" cy="70" r="18" stroke="#c0bfbc" stroke-width="1" opacity="0.18"/>
      <circle cx="58" cy="70" r="15.4" stroke="#981F31" stroke-width="1" opacity="0.3"/>
      <path fill="url(#shine)" d="M40 44a22 28 0 0 1 28 8 26 22 0 0 1-6 30 20 24 0 0 1-22-38z"/>
    </g>

    <circle cx="58" cy="70" r="12.5" fill="#1a1418"/>
    <circle cx="58" cy="70" r="11.2" fill="#3a2a32"/>
    <circle cx="58" cy="70" r="10.2" fill="#981F31"/>
    <circle cx="58" cy="70" r="6.8" fill="#7C3B96"/>
    <circle cx="58" cy="70" r="4.6" fill="#3a2a32"/>
    <rect x="56" y="68" width="4" height="4" fill="#1a1418"/>

    <circle cx="104" cy="100" r="6.5" fill="#5e5c64"/>
    <circle cx="104" cy="100" r="4.5" fill="#9a9996"/>
    <rect x="103" y="94" width="2" height="5" rx="1" fill="#3d3846"/>

    <g transform="translate(98 38) rotate(114)">
      <circle cx="-12" cy="0" r="5.5" fill="#241f31"/>
      <rect x="-13" y="-2" width="14" height="4" rx="2" fill="#77767b"/>
      <rect x="-1" y="-2.2" width="44" height="4.4" rx="1.2" fill="url(#tube)"/>
      <rect x="40.5" y="-4.4" width="10" height="8.8" rx="1.2" fill="#241f31"/>
      <rect x="49" y="-1" width="7" height="2" fill="#981F31"/>
      <circle cx="0" cy="0" r="6.2" fill="#9a9996"/>
      <circle cx="0" cy="0" r="3.6" fill="#deddda"/>
    </g>
  </g>

  <path fill="#000" opacity=".22" d="M8 92v2c0 14.4 11.6 26 26 26h60c14.4 0 26-11.6 26-26v-2c0 14.4-11.6 26-26 26H34C19.6 118 8 106.4 8 92z"/>
  <path fill="#fff" opacity=".08" d="M8 36v-2c0-14.4 11.6-26 26-26h60c14.4 0 26 11.6 26 26v2c0-14.4-11.6-26-26-26H34C19.6 8 8 19.6 8 34z"/>
</svg>
