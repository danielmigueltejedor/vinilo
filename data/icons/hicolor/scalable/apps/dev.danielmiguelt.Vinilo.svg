    <filter id="shadow" x="-10%" y="-6%" width="120%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)" filter="url(#shadow)"/>

  <g clip-path="url(#tile-clip)">
    <circle cx="58" cy="70" r="39" fill="url(#platter)"/>
    <circle cx="58" cy="70" r="33" fill="url(#vinyl)"/>

