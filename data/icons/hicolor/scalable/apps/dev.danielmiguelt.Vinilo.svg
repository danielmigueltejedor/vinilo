  <path fill="#000" opacity=".12" d="M8 92v2c0 14.4 11.6 26 26 26h60c14.4 0 26-11.6 26-26v-2c0 14.4-11.6 26-26 26H34C19.6 118 8 106.4 8 92z"/>
