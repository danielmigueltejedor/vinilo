      <circle cx="58" cy="70" r="31.2" stroke="#5e5c64" stroke-width="0.35" opacity="0.35"/>
      <circle cx="58" cy="70" r="29.4" stroke="#c01c28" stroke-width="0.45" opacity="0.22"/>
      <circle cx="58" cy="70" r="27.6" stroke="#f6f5f4" stroke-width="0.35" opacity="0.12"/>
      <circle cx="58" cy="70" r="25.8" stroke="#813d9c" stroke-width="0.45" opacity="0.28"/>
      <circle cx="58" cy="70" r="24.0" stroke="#f6f5f4" stroke-width="0.3" opacity="0.10"/>
      <circle cx="58" cy="70" r="22.2" stroke="#c01c28" stroke-width="0.4" opacity="0.18"/>
      <circle cx="58" cy="70" r="20.4" stroke="#f6f5f4" stroke-width="0.3" opacity="0.10"/>
      <circle cx="58" cy="70" r="18.6" stroke="#813d9c" stroke-width="0.4" opacity="0.22"/>
      <circle cx="58" cy="70" r="16.8" stroke="#f6f5f4" stroke-width="0.3" opacity="0.10"/>
      <circle cx="58" cy="70" r="15.0" stroke="#c0bfbc" stroke-width="0.35" opacity="0.16"/>
