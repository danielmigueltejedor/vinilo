<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Vinilo</title>
  <defs>
    <!-- Colloid apps: 64 canvas, 56 tile, rx≈13. Doubled for hicolor. -->
    <linearGradient id="tile" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbb089"/>
      <stop offset="1" stop-color="#7d5334"/>
    </linearGradient>
    <radialGradient id="platter" cx="48" cy="54" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.55" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#77767b"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50" cy="56" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="0.35" stop-color="#1c1a22"/>
      <stop offset="1" stop-color="#0d0c10"/>
    </radialGradient>
    <linearGradient id="shine" x1="40" y1="44" x2="78" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#c061cb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.5" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <clipPath id="tile-clip">
