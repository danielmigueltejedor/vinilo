    <circle cx="58" cy="70" r="12.5" fill="#241f31"/>
    <circle cx="58" cy="70" r="11.4" fill="#e8d5c4"/>
    <circle cx="58" cy="70" r="10.6" fill="#c01c28"/>
    <circle cx="58" cy="70" r="7.2" fill="#813d9c"/>
    <circle cx="58" cy="70" r="5.4" fill="#e8d5c4"/>
    <circle cx="58" cy="70" r="2.4" fill="#5e5c64"/>
    <circle cx="58" cy="70" r="1.5" fill="#1c1a22"/>

    <circle cx="104" cy="100" r="6.5" fill="#9a9996"/>
    <circle cx="104" cy="100" r="4.5" fill="#f6f5f4"/>
    <rect x="103" y="94" width="2" height="5" rx="1" fill="#5e5c64"/>

