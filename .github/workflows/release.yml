name: Release bundles

# A tag push builds and publishes every package. To publish a fix for one platform only (a z
# version for macOS, say), run this workflow by hand on the tag with platforms: macos; the
# release then carries only the disk images and is not marked latest, so installed Linux
# copies and the website keep the newest release that has their package.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which packages to build and publish"
        type: choice
        options: [all, macos]
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian / Ubuntu package
            packager: deb
            image: ubuntu:26.04
          - name: Fedora RPM
            packager: rpm
            image: fedora:43
          - name: Arch Linux package
            packager: archlinux
            image: archlinux:base-devel

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install distribution build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.packager }}" in
            deb)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git tar gzip build-essential pkg-config \
                libgtk-4-dev libpulse-dev libasound2-dev \
                libwebkitgtk-6.0-dev librsvg2-dev nodejs npm
              ;;
            rpm)
              dnf -y install \
                ca-certificates curl git tar gzip gcc gcc-c++ make \
                pkgconf-pkg-config gtk4-devel \
                pulseaudio-libs-devel alsa-lib-devel webkitgtk6.0-devel \
                librsvg2-devel nodejs npm
              ;;
            archlinux)
              pacman -Syu --needed --noconfirm \
                ca-certificates curl git tar gzip base-devel pkgconf \
                gtk4 libpulse alsa-lib webkitgtk-6.0 librsvg \
                nodejs npm
              ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install current stable Rust
        shell: bash
        run: |
          set -euxo pipefail
          # Download the installer and verify its checksum before executing —
          # never pipe a remote script straight into a shell.
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) rust_host=x86_64-unknown-linux-gnu ;;
            aarch64|arm64) rust_host=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          base="https://static.rust-lang.org/rustup/dist/${rust_host}"
          curl --proto '=https' --tlsv1.2 -sSfO "${base}/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSfO "${base}/rustup-init.sha256"
          sha256sum -c rustup-init.sha256
          chmod +x rustup-init
          ./rustup-init -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" default stable
          "$HOME/.cargo/bin/rustc" --version

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.packager }}-${{ hashFiles('Cargo.lock') }}

      - name: Build Vinilo
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --locked
          make sidecar
          ./packaging/release/stage.sh

      - name: Install nFPM
        shell: bash
        run: |
          set -euxo pipefail
          # Pin HTTPS and verify the published checksum before unpacking.
          url="https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o nfpm.tar.gz "$url"
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm.tar.gz" \
            | sha256sum -c -
          tar -xz -C /usr/local/bin -f nfpm.tar.gz nfpm
          nfpm --version

      - name: Build native package
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=$(awk -F\" '/^version = / {print $2; exit}' Cargo.toml)
          export VERSION

          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

          mkdir -p dist/packages
          case "${{ matrix.packager }}" in
            deb)
              OUTPUT="dist/packages/vinilo_${VERSION}_amd64.deb"
              ;;
            rpm)
              OUTPUT="dist/packages/vinilo-${VERSION}-1.x86_64.rpm"
              ;;
            archlinux)
              OUTPUT="dist/packages/vinilo-${VERSION}-1-x86_64.pkg.tar.zst"
              ;;
          esac

          nfpm pkg \
            --config packaging/release/nfpm.yaml \
            --packager "${{ matrix.packager }}" \
            --target "$OUTPUT"

          test -s "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Keep native package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.packager }}
          path: dist/packages/*
          retention-days: 14

  flatpak:
    name: Flatpak bundle
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'macos'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Flatpak toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build Flatpak bundle
        run: |
          set -euxo pipefail
          make flatpak-bundle
          VERSION=$(awk -F\" '/^version = / {print $2; exit}' Cargo.toml)

          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

          mv Vinilo.flatpak "Vinilo-${VERSION}.flatpak"
          test -s "Vinilo-${VERSION}.flatpak"

      - name: Keep Flatpak bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-flatpak
          path: Vinilo-*.flatpak
          retention-days: 14

  # Same toolchain floor as the .deb job (GTK 4.20). The
  # AppImage bundles those libraries so it can run on hosts that cannot build
  # Vinilo, the same audience Flatpak already serves.
  appimage:
    name: AppImage
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'macos'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      # linuxdeploy needs to see host devices when resolving libraries; the
      # default container mount is enough once FUSE is skipped via
      # APPIMAGE_EXTRACT_AND_RUN (set inside appimage.sh).

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git tar gzip build-essential pkg-config \
            file desktop-file-utils \
            libgtk-4-dev libpulse-dev libasound2-dev \
            libwebkitgtk-6.0-dev librsvg2-dev nodejs npm
          # Runtime libraries of the bundled Electron sidecar. linuxdeploy copies
          # them into the AppImage and fails on any it cannot find. Names differ
          # between Ubuntu releases (the t64 transition), so each is tried alone.
          for pkg in libnss3 libnspr4 libxkbcommon0 libxcomposite1 libxdamage1 \
                     libxfixes3 libxrandr2 libgbm1 libdrm2 libxshmfence1 \
                     libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
                     libatspi2.0-0t64 libatspi2.0-0 libcups2t64 libcups2 \
                     libgtk-3-0t64 libgtk-3-0; do
            apt-get install -y --no-install-recommends "$pkg" || echo "not available: $pkg"
          done
          # linuxdeploy-plugin-gtk copies <libdir>/gtk-4.0 (GTK's loadable modules).
          # Without recommended packages that directory does not exist, so install
          # the media backend that provides it and make sure the directory is there.
          apt-get install -y --no-install-recommends libgtk-4-media-gstreamer || echo "not available: libgtk-4-media-gstreamer"
          mkdir -p "$(pkg-config --variable=libdir gtk4)/gtk-4.0"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install current stable Rust
        shell: bash
        run: |
          set -euxo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) rust_host=x86_64-unknown-linux-gnu ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          base="https://static.rust-lang.org/rustup/dist/${rust_host}"
          curl --proto '=https' --tlsv1.2 -sSfO "${base}/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSfO "${base}/rustup-init.sha256"
          sha256sum -c rustup-init.sha256
          chmod +x rustup-init
          ./rustup-init -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" default stable
          "$HOME/.cargo/bin/rustc" --version

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-appimage-${{ hashFiles('Cargo.lock') }}

      - name: Build Vinilo and AppImage
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --locked
          make sidecar
          ./packaging/release/stage.sh
          chmod +x ./packaging/release/appimage.sh
          ./packaging/release/appimage.sh

          VERSION=$(awk -F\" '/^version = / {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          test -s "dist/packages/Vinilo-${VERSION}-x86_64.AppImage"

      - name: Keep AppImage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-appimage
          path: dist/packages/*.AppImage
          retention-days: 14

  macos:
    name: macOS DMG (Nodalia edition)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install build dependencies
        run: |
          brew install gtk4 librsvg adwaita-icon-theme pkgconf node
          rustup default stable

      - name: Link against the macOS 26 SDK (Liquid Glass window controls)
        run: ./packaging/macos/xcode_sdk.sh select

      - name: Build Vinilo Nodalia.app and the DMG
        env:
          # castLabs EVS, for the Widevine VMP signature Apple Music needs on macOS.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          set -euxo pipefail
          VERSION=$(awk -F\" '/^version = / {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          cargo build --release --locked
          make sidecar
          ./packaging/macos/xcode_sdk.sh check target/release/vinilo
          ./packaging/macos/bundle.sh dist/macos
          ./packaging/macos/create_dmg.sh "dist/macos/Vinilo Nodalia.app" "dist/Vinilo-${VERSION}-nodalia-macos-arm64.dmg"

      - name: Keep DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-macos
          path: dist/Vinilo-*-nodalia-macos-arm64.dmg
          retention-days: 14

  macos-native:
    name: macOS DMG (Native edition)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install build dependencies
        run: |
          brew install node
          rustup default stable
          swift --version

      - name: Test, then build Vinilo Native.app and the DMG
        env:
          # castLabs EVS, for the Widevine VMP signature Apple Music needs on macOS.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          set -euxo pipefail
          VERSION=$(awk -F\" '/^version = / {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          swift test --package-path platforms/apple
          cargo build --release -p vinilod --locked
          make sidecar
          ./platforms/apple/build.sh dist/macos
          ./packaging/macos/create_dmg.sh "dist/macos/Vinilo Native.app" "dist/Vinilo-${VERSION}-native-macos-arm64.dmg"

      - name: Keep DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-macos-native
          path: dist/Vinilo-*-native-macos-arm64.dmg
          retention-days: 14

  release:
    name: Publish GitHub Release
    # Skipped Linux jobs (platforms: macos) must not stop the publish; a failed one still does.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [packages, flatpak, appimage, macos, macos-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euxo pipefail
          cd release
          # A macOS-only release has no Linux packages: absent patterns are dropped, not errors.
          shopt -s nullglob
          sha256sum -- \
            *.deb \
            *.rpm \
            *.pkg.tar.zst \
            *.flatpak \
            *.AppImage \
            *.dmg \
            > SHA256SUMS
          # One checksum file per DMG too, the shape the website looks for.
          for dmg in *.dmg; do sha256sum -- "$dmg" > "$dmg.sha256"; done
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag push may already have a notes-only release; attach bundles
          # either way so a pre-created release does not fail the job.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            latest=true
            [[ "${PLATFORMS:-all}" == macos ]] && latest=false
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Vinilo $VERSION" \
              --latest="$latest" \
              --notes "Vinilo $VERSION"
          fi
