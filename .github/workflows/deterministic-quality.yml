name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      # Pin the action by commit so a floating tag cannot swap under us.
      # `toolchain` must be set explicitly when the ref is a SHA — `@stable`
      # used to supply it; a bare SHA does not.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Rust formatting (fail closed)
        run: cargo fmt --all -- --check
      - name: Cargo workspace and lockfile integrity
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
