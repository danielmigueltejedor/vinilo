#
# Autoscan configuration (not sonar-project.properties — that file is ignored
# under automatic analysis). See SonarCloud "Automatic analysis" docs.
#
# protocol_digest.rs holds MD5 / SHA-1 only because Last.fm and YouTube Music
# require those digests on the wire. Excluding this one file keeps Autoscan
# from failing the security gate on algorithms we are not free to replace.

sonar.exclusions=**/protocol_digest.rs
